[project]
name = "wildsearch"
version = "0.1.0"
description = "Semantic search for photo libraries, from the command line."
readme = "README.md"
authors = [
    { name = "Leon Petrinos" }
]
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "platformdirs>=4.13.3",
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[project.scripts]
wildsearch = "wildsearch.cli:app"

[project.optional-dependencies]
ml = [
    "open-clip-torch>=3.3.0",
    "torch>=2.14.1",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
