[project]
name = "wildsearch"
version = "0.1.0"
description = "Semantic search for photo libraries, from the command line."
readme = "README.md"
authors = [
    { name = "Leon Petrinos" }
]
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "typer>=0.27.3",
]

[project.scripts]
wildsearch = "wildsearch.cli:app"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
